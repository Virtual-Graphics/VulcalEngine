name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          # Bound transient mirror/network failures; never continue with stale indexes.
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )
          if ! sudo timeout --kill-after=10s 60s \
            apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update; then
            echo "::warning::Default APT sources failed; trying the kernel.org Ubuntu mirror."
            source /etc/os-release
            : "${VERSION_CODENAME:?Ubuntu release codename is required}"
            mirror_sources="${RUNNER_TEMP}/vulcal-ubuntu.sources"
            cat > "$mirror_sources" <<EOF
          Types: deb
          URIs: https://mirrors.kernel.org/ubuntu/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            apt_options+=(
              -o "Dir::Etc::sourcelist=$mirror_sources"
              -o Dir::Etc::sourceparts=-
            )
            sudo timeout --kill-after=10s 120s \
              apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          fi
          sudo apt-get "${apt_options[@]}" install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
