name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        profiling: ["OFF", "ON"]

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4

      - &install-dependencies
        name: Install dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          # Bound transient mirror/network failures; never continue with stale indexes.
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )
          if ! sudo timeout --kill-after=10s 60s \
            apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update; then
            echo "::warning::Default APT sources failed; trying the kernel.org Ubuntu mirror."
            source /etc/os-release
            : "${VERSION_CODENAME:?Ubuntu release codename is required}"
            mirror_sources="${RUNNER_TEMP}/vulcal-ubuntu.sources"
            cat > "$mirror_sources" <<EOF
          Types: deb
          URIs: https://mirrors.kernel.org/ubuntu/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            apt_options+=(
              -o "Dir::Etc::sourcelist=$mirror_sources"
              -o Dir::Etc::sourceparts=-
            )
            sudo timeout --kill-after=10s 120s \
              apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          fi
          sudo apt-get "${apt_options[@]}" install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Configure
        run: cmake --preset linux-debug -DVULCAL_ENABLE_PROFILING=${{ matrix.profiling }}

      - name: Build
        run: cmake --build --preset linux-debug --parallel

      - name: Run tests
        run: ctest --test-dir build/linux-debug --output-on-failure

  static-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - *checkout
      - *install-dependencies

      - name: Configure
        run: cmake --preset release-static

      - name: Build
        run: cmake --build --preset release-static --parallel

      # The shipped Player must not depend on system copies of the vendored
      # dependencies, otherwise packaged games fail to start on clean machines.
      - name: Verify vendored dependencies are linked statically
        run: |
          ldd build/release-static/bin/vulcal_player
          if ldd build/release-static/bin/vulcal_player | grep -Eq 'libSDL3|libspdlog|libfmt'; then
            echo "::error::vulcal_player still links SDL3/spdlog/fmt dynamically; static release builds are broken"
            exit 1
          fi
