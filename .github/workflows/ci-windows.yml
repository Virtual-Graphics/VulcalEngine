name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    strategy:
      matrix:
        profiling: ["OFF", "ON"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Avoid the hosted runner's DbgHelp failure during GoogleTest discovery.
      - name: Configure
        run: cmake -B build -A x64 -DVULCAL_ENABLE_PROFILING=${{ matrix.profiling }} -DTRACY_NO_CALLSTACK=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure
